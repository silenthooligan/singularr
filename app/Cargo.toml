[package]
name = "singularr"
description = "Singularr: a media manager for a media server (Plex, Jellyfin, Emby). The server: the API, the sync loops, the rules, and the web client's files."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "singularrd"
path = "src/main.rs"

[dependencies]
singularr-core = { workspace = true }
# The way out's types and rules, and the recorded transport the tests send through (`testkit`).
singularr-sdk = { workspace = true, features = ["testkit"] }
# The platform: the database, the journal, callers and keys, problems, the way out, mail, the
# jobs, ffmpeg runs, the settings mechanism, the access book, the integrations' rows and the
# metrics' names. `core`, `settings` and `engines` re-export its modules.
singularr-platform = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# server
axum = { version = "0.8", features = ["macros"], optional = true }
# Compressed answers (gzip, brotli), negotiated by Accept-Encoding: the API and the web client.
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "process"], optional = true }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-ring", "chrono", "migrate", "json"], optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
async-trait = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
subtle = { version = "2.6", optional = true }
# The portal role's password as a SCRAM-SHA-256 verifier (requests::role): HMAC and SASLprep as
# sqlx's own SCRAM sign-in uses them. The system's random source as uuid uses it. The lock file
# holds all three already.
hmac = { version = "0.13", optional = true }
stringprep = { version = "0.1", optional = true }
getrandom = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
utoipa = { version = "6", features = ["axum_extras", "chrono"], optional = true }
axum-prometheus = { version = "0.10", optional = true }
# Locations (core::geoip): the DB-IP City Lite database, a MaxMind DB file read in memory, and
# its download uncompressed from gzip.
maxminddb = { version = "0.33", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The platform's test kit: `Settings::remember` for the tests of the app's fields.
singularr-platform = { workspace = true, features = ["testkit"] }
# The tests read a compressed answer back.
flate2 = "1"
brotli = "9"

[features]
# Everything that touches the database or the network is behind `ssr`, the only feature.
default = ["ssr"]
ssr = [
    "dep:singularr-platform",
    "dep:axum",
    "dep:tower-http",
    "dep:tokio",
    "dep:sqlx",
    "dep:reqwest",
    "dep:async-trait",
    "dep:async-stream",
    "dep:futures",
    "dep:thiserror",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:sha2",
    "dep:hex",
    "dep:subtle",
    "dep:hmac",
    "dep:stringprep",
    "dep:getrandom",
    "dep:uuid",
    "dep:utoipa",
    "dep:axum-prometheus",
    "dep:maxminddb",
    "dep:flate2",
    "singularr-sdk/openapi",
    "singularr-sdk/sqlx",
]
