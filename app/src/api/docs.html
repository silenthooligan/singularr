<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singularr API reference</title>
<style>
  :root { color-scheme: dark; --bg:#1e1e2e; --panel:#181825; --line:#313244; --text:#cdd6f4; --dim:#a6adc8; --blue:#89b4fa; --green:#a6e3a1; --yellow:#f9e2af; --red:#f38ba8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { padding:1rem 1.5rem; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.3rem; }
  header p { margin:.3rem 0 0; color:var(--dim); max-width:70rem; }
  main { display:grid; grid-template-columns:17rem 1fr; }
  nav { padding:1rem; border-right:1px solid var(--line); position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto; }
  nav h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:1rem 0 .3rem; }
  nav a { display:block; color:var(--text); text-decoration:none; padding:.1rem 0; font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav a:hover { color:var(--blue); }
  section { padding:1rem 1.5rem; min-width:0; }
  article { border:1px solid var(--line); background:var(--panel); border-radius:.4rem; margin:0 0 1rem; padding:1rem; }
  article h3 { margin:0; font:600 1rem ui-monospace,monospace; word-break:break-all; }
  .m { display:inline-block; min-width:4.2rem; text-align:center; border-radius:.25rem; padding:0 .4rem; margin-right:.5rem; color:#11111b; font-weight:700; }
  .get { background:var(--blue); } .post { background:var(--green); } .delete { background:var(--red); } .put { background:var(--yellow); }
  .sum { color:var(--dim); margin:.4rem 0 0; white-space:pre-line; }
  h4 { margin:1rem 0 .3rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  table { border-collapse:collapse; width:100%; }
  td, th { text-align:left; vertical-align:top; padding:.25rem .6rem .25rem 0; border-top:1px solid var(--line); font-size:.9rem; }
  code, pre { font:13px ui-monospace,monospace; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:.3rem; padding:.6rem; overflow:auto; margin:.3rem 0; }
  details > summary { cursor:pointer; color:var(--blue); }
  .dim { color:var(--dim); }
  #gate { margin:1rem 1.5rem; padding:1rem; border:1px solid var(--yellow); border-radius:.4rem; display:none; }
  #gate input { width:28rem; max-width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); padding:.4rem; border-radius:.3rem; }
  #gate button { padding:.4rem .8rem; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } nav { position:static; border-right:0; border-bottom:1px solid var(--line); max-height:none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Singularr API reference</h1>
  <p id="about">Loading the API description.</p>
  <p class="dim">The machine-readable document is at <a href="/api/v1/openapi.json" style="color:var(--blue)">/api/v1/openapi.json</a>. Back to <a href="/" style="color:var(--blue)">Singularr</a>.</p>
</header>
<div id="gate">
  <p><strong>Sign in required.</strong> Open this page through the edge, or paste an API key to read the description. The key stays in this tab and is sent only to this server.</p>
  <input id="key" type="password" placeholder="mq_..." autocomplete="off">
  <button id="load">Load</button>
</div>
<main>
  <nav id="nav"></nav>
  <section id="ops"></section>
</main>
<script>
(function () {
  "use strict";
  var doc = null;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") { node.textContent = attrs[k]; } else { node.setAttribute(k, attrs[k]); }
    });
    (children || []).forEach(function (c) { if (c) { node.appendChild(c); } });
    return node;
  }

  function resolve(schema) {
    var seen = 0;
    while (schema && schema.$ref && seen < 20) {
      var name = schema.$ref.split("/").pop();
      schema = (doc.components && doc.components.schemas && doc.components.schemas[name]) || {};
      seen += 1;
    }
    return schema || {};
  }

  function typeName(schema) {
    if (!schema) { return "any"; }
    if (schema.$ref) { return schema.$ref.split("/").pop(); }
    if (schema.oneOf || schema.anyOf) {
      return (schema.oneOf || schema.anyOf).map(typeName).filter(function (t) { return t !== "null"; }).join(" | ") + " (optional)";
    }
    if (schema.type === "array") { return "array of " + typeName(schema.items); }
    if (Array.isArray(schema.type)) {
      var rest = schema.type.filter(function (t) { return t !== "null"; });
      var inner = rest[0] === "array" ? "array of " + typeName(schema.items) : rest.join(" | ");
      return inner + (rest.length < schema.type.length ? " (optional)" : "");
    }
    if (schema.enum) { return schema.enum.map(function (v) { return JSON.stringify(v); }).join(" | "); }
    return schema.type || "object";
  }

  // A type that folds another in (allOf) is shown as one list of fields.
  function merged(schema) {
    schema = resolve(schema);
    if (!schema.allOf) { return schema; }
    var out = { type: "object", properties: {}, required: [], description: schema.description };
    schema.allOf.forEach(function (part) {
      part = merged(part);
      Object.keys(part.properties || {}).forEach(function (k) { out.properties[k] = part.properties[k]; });
      out.required = out.required.concat(part.required || []);
    });
    return out;
  }

  function fields(schema, depth) {
    schema = merged(schema);
    if (schema.type === "array" || (Array.isArray(schema.type) && schema.type.indexOf("array") >= 0)) { return fields(schema.items, depth); }
    var props = schema.properties;
    if (!props) { return null; }
    var required = schema.required || [];
    var table = el("table", {}, []);
    Object.keys(props).forEach(function (name) {
      var p = props[name];
      var nested = null;
      var target = p.$ref ? p : (p.items && p.items.$ref ? p.items : null);
      if (!target && (p.oneOf || p.anyOf)) {
        target = (p.oneOf || p.anyOf).filter(function (x) { return x.$ref; })[0] || null;
      }
      if (target && depth < 3) {
        var inner = fields(target, depth + 1);
        if (inner) { nested = el("details", {}, [el("summary", { text: "fields of " + typeName(target) }), inner]); }
      }
      table.appendChild(el("tr", {}, [
        el("td", {}, [el("code", { text: name + (required.indexOf(name) >= 0 ? "" : "?") })]),
        el("td", {}, [el("code", { text: typeName(p) })]),
        el("td", {}, [el("span", { text: p.description || resolve(p).description || "" }), nested])
      ]));
    });
    return table;
  }

  function body(content) {
    if (!content) { return null; }
    var type = Object.keys(content)[0];
    var schema = content[type].schema;
    var box = el("div", {}, [el("div", { class: "dim" }, [el("code", { text: type + ": " + typeName(schema) })])]);
    var table = fields(schema, 0);
    if (table) { box.appendChild(table); }
    return box;
  }

  function operation(path, method, op) {
    var id = (method + path).replace(/[^a-z0-9]+/gi, "-");
    var art = el("article", { id: id }, [
      el("h3", {}, [el("span", { class: "m " + method, text: method.toUpperCase() }), el("span", { text: path })]),
      el("p", { class: "sum", text: [op.summary, op.description].filter(Boolean).join("\n") })
    ]);
    var open = op.security && op.security.length === 1 && Object.keys(op.security[0]).length === 0;
    art.appendChild(el("p", { class: "dim", text: open ? "No sign-in needed." : "Needs the owner's session or an API key." }));
    if (op.parameters && op.parameters.length) {
      art.appendChild(el("h4", { text: "Parameters" }));
      var table = el("table", {}, []);
      op.parameters.forEach(function (p) {
        table.appendChild(el("tr", {}, [
          el("td", {}, [el("code", { text: p.name + (p.required ? "" : "?") })]),
          el("td", {}, [el("code", { text: p.in + ", " + typeName(p.schema) })]),
          el("td", { text: p.description || "" })
        ]));
      });
      art.appendChild(table);
    }
    if (op.requestBody) {
      art.appendChild(el("h4", { text: "Request body" }));
      art.appendChild(body(op.requestBody.content));
    }
    art.appendChild(el("h4", { text: "Responses" }));
    Object.keys(op.responses || {}).forEach(function (status) {
      var r = op.responses[status];
      var inner = body(r.content);
      art.appendChild(el("details", status.charAt(0) === "2" ? { open: "" } : {}, [
        el("summary", { text: status + (r.description ? ": " + r.description : "") }),
        inner
      ]));
    });
    return { id: id, node: art };
  }

  function render() {
    document.getElementById("title").textContent = doc.info.title + " " + (doc.info.version || "");
    document.getElementById("about").textContent = doc.info.description || "";
    var nav = document.getElementById("nav");
    var ops = document.getElementById("ops");
    nav.textContent = "";
    ops.textContent = "";
    var byTag = {};
    Object.keys(doc.paths).forEach(function (path) {
      Object.keys(doc.paths[path]).forEach(function (method) {
        var op = doc.paths[path][method];
        var tag = (op.tags && op.tags[0]) || "other";
        (byTag[tag] = byTag[tag] || []).push({ path: path, method: method, op: op });
      });
    });
    var order = (doc.tags || []).map(function (t) { return t.name; });
    Object.keys(byTag).forEach(function (t) { if (order.indexOf(t) < 0) { order.push(t); } });
    order.forEach(function (tag) {
      if (!byTag[tag]) { return; }
      var about = (doc.tags || []).filter(function (t) { return t.name === tag; })[0];
      nav.appendChild(el("h2", { text: tag }));
      ops.appendChild(el("h2", { text: tag }));
      if (about && about.description) { ops.appendChild(el("p", { class: "dim", text: about.description })); }
      byTag[tag].forEach(function (item) {
        var made = operation(item.path, item.method, item.op);
        nav.appendChild(el("a", { href: "#" + made.id, text: item.method.toUpperCase() + " " + item.path.replace("/api/v1", "") }));
        ops.appendChild(made.node);
      });
    });
  }

  function load(key) {
    var headers = key ? { Authorization: "Bearer " + key } : {};
    fetch("/api/v1/openapi.json", { headers: headers, credentials: "same-origin" }).then(function (res) {
      if (res.status === 401 || res.status === 403) {
        document.getElementById("gate").style.display = "block";
        document.getElementById("about").textContent = "The API description needs a sign-in.";
        return null;
      }
      return res.json();
    }).then(function (json) {
      if (!json) { return; }
      doc = json;
      document.getElementById("gate").style.display = "none";
      render();
    }).catch(function (e) {
      document.getElementById("about").textContent = "The API description could not be loaded: " + e;
    });
  }

  document.getElementById("load").addEventListener("click", function () {
    load(document.getElementById("key").value.trim());
  });
  load("");
}());
</script>
</body>
</html>
