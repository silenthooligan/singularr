[workspace]
resolver = "3"
members = ["crates/singularr-core", "crates/singularr-sdk", "crates/singularr-platform", "app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
regex = "1"
thiserror = "2"
singularr-core = { path = "crates/singularr-core" }
singularr-sdk = { path = "crates/singularr-sdk" }
singularr-platform = { path = "crates/singularr-platform" }
