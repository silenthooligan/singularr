arr_formats = ["radarr:HMAX", "sonarr:HMAX"]
when = { service = ["HMAX", "MAX", "HBO"], source = ["WebDl", "WebRip"] }

[[traits]]
id = "service.stz"
label = "Starz stream"
category = "service"
why = "Starz counts in the second band of services."
arr_formats = ["radarr:STZ", "sonarr:STZ"]
when = { service = ["STZ"], source = ["WebDl", "WebRip"] }

[[traits]]
id = "service.mgmp"
label = "MGM+ stream"
category = "service"
why = "MGM+ counts in the second band of services."
arr_formats = ["radarr:MGMP", "sonarr:MGMP"]
when = { service = ["MGMP"], source = ["WebDl", "WebRip"] }

[[traits]]
id = "service.skst"
label = "SkyShowtime stream"
category = "service"
why = "SkyShowtime counts in the second band of services."
arr_formats = ["radarr:SKST", "sonarr:SKST"]
when = { service = ["SKST"], source = ["WebDl", "WebRip"] }

[[traits]]
id = "service.now"
label = "NOW stream"
category = "service"
why = "NOW counts in the second band of services."
arr_formats = ["radarr:NOW", "sonarr:NOW"]
when = { service = ["NOW"], source = ["WebDl", "WebRip"] }

# ----------------------------------------------------------------------------------------------
# Editions
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "edition.open-matte"
label = "Open matte"
category = "edition"
why = "Open matte shows more picture at the top and bottom. It breaks a tie and never outranks a better tier."
arr_formats = ["radarr:Open Matte"]
when = { edition = ["Open Matte"] }

[[traits]]
id = "edition.imax"
label = "IMAX"
category = "edition"
why = "The IMAX version shows more picture in the scenes shot for it."
arr_formats = ["radarr:IMAX"]
when = { edition = ["IMAX"] }

[[traits]]
id = "edition.imax-enhanced"
label = "IMAX Enhanced"
category = "edition"
why = "IMAX Enhanced streams from Disney+ and Bravia Core carry the taller IMAX picture for the whole film."
arr_formats = ["radarr:IMAX Enhanced"]

[traits.when]
any = [
    { edition = ["IMAX Enhanced"] },
    { edition = ["IMAX"], service = ["DSNP", "DSNY", "BCORE"], source = ["WebDl", "WebRip"] },
]

[[traits]]
id = "edition.4k-remaster"
label = "4K remaster"
category = "edition"
why = "A 1080p copy made from a 4K remaster of the film, a better master than the old disc."
arr_formats = ["radarr:4K Remaster"]
when = { edition = ["4K Remaster"], not = { resolution = ["2160p"] } }

[[traits]]
id = "edition.remaster"
label = "Remaster"
category = "edition"
why = "A remastered release, from a newer master than the first disc."
arr_formats = ["radarr:Remaster", "sonarr:Remaster"]
when = { edition = ["Remastered"], not = { edition = ["4K Remaster"] } }

[[traits]]
id = "edition.special"
label = "Special cut"
category = "edition"
why = "An extended, unrated, director's or other special cut holds more of the film than the theatrical one."
arr_formats = ["radarr:Special Edition"]

[traits.when]
edition = [
    "Extended", "Unrated", "Uncut", "Uncensored", "Director's Cut", "Special Edition",
    "Final Cut", "Ultimate", "Collector's", "Alternate Cut", "* Cut", "* Edition",
]
not = { edition = ["Open Matte", "Theatrical"] }

[[traits]]
id = "edition.criterion"
label = "Criterion Collection"
category = "edition"
why = "A Criterion disc is usually the best master of an older film."
arr_formats = ["radarr:Criterion Collection"]

[traits.when]
edition = ["Criterion"]
source = ["BluRay", "Remux", "Dvd"]
not = { group = ["Criterion"] }

# ----------------------------------------------------------------------------------------------
# Source and release facts
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "other.disc-source"
label = "Disc source"
category = "other"
why = "A copy from a Blu-ray disc beats a stream from the same tier of group."
arr_formats = ["radarr:Bluray"]
when = { source = ["BluRay", "Remux"] }

[[traits]]
id = "other.uhd-source"
label = "From a UHD master"
category = "other"
why = "The name says DS4K or UHD: the copy was made from the 4K master, which is usually the better one."
arr_formats = ["radarr:DS4K"]
when = { name = "DS4K|UHD" }

[[traits]]
id = "other.repack-proper"
label = "Repack or proper"
category = "other"
why = "A repack or proper fixes a fault in the first release."
arr_formats = ["radarr:Repack/Proper", "sonarr:Repack/Proper"]
when = { proper_or_repack = true }

[[traits]]
id = "other.hybrid"
label = "Hybrid"
category = "other"
why = "A hybrid release combines the best parts of several sources. No lane gives it points today."
arr_formats = ["sonarr:Hybrid"]
when = { name = '\bhybrid(\b|\d)', source = ["BluRay", "Remux"], not = { group = ["HYBRID"] } }

# ----------------------------------------------------------------------------------------------
# Video
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "video.x264"
label = "H.264"
category = "video"
why = "Every 1080p encode gets these points for naming its codec, so the lane minimum asks for something more."
arr_formats = ["radarr:x264"]
when = { video_codec = ["H264"], not = { source = ["Remux"] } }

[[traits]]
id = "video.x265-hd"
label = "HEVC below 2160p"
category = "video"
why = "Every 1080p encode gets these points for naming its codec, so the lane minimum asks for something more."
arr_formats = ["radarr:x265 (HD)"]
when = { video_codec = ["H265"], not = { resolution = ["2160p"] } }

[[traits]]
id = "video.av1"
label = "AV1"
category = "video"
why = "AV1 holds the same picture in fewer bits than HEVC."
arr_formats = ["sonarr:AV1"]
when = { video_codec = ["Av1"] }

[[traits]]
id = "video.hdr"
label = "HDR, format not named"
category = "video"
why = "The name says HDR without saying which kind."
arr_formats = ["radarr:HDR"]

[traits.when]
hdr = ["Hdr"]

[traits.when.not]
any = [
    { hdr = ["DolbyVision", "Hdr10", "Hdr10Plus", "Hlg", "Pq"] },
    { group = ["FraMeSToR", "HQMUX", "SiCFoI"] },
]

[[traits]]
id = "video.hdr10"
label = "HDR10"
category = "video"
why = "HDR10 plays on every HDR screen."
arr_formats = ["radarr:HDR10"]
when = { hdr = ["Hdr10"], not = { hdr = ["DolbyVision", "Hlg", "Pq"] } }

[[traits]]
id = "video.dv-hdr10"
label = "Dolby Vision with HDR10"
category = "video"
why = "Dolby Vision with an HDR10 layer plays everywhere and looks best on Dolby Vision screens."
arr_formats = ["radarr:DV HDR10"]

[traits.when]
hdr = ["DolbyVision"]
not = { hdr = ["Hdr10Plus", "Hlg"] }
any = [
    { hdr = ["Hdr10"] },
    { hdr = ["Hdr"] },
]

[[traits]]
id = "video.dv-hdr10plus"
label = "Dolby Vision with HDR10+"
category = "video"
why = "Dolby Vision with an HDR10+ layer carries both kinds of scene-by-scene HDR."
arr_formats = ["radarr:DV HDR10+"]
when = { hdr = ["DolbyVision"], any = [{ hdr = ["Hdr10Plus"] }], not = { hdr = ["Hlg"] } }

[[traits]]
id = "video.hdr10plus"
label = "HDR10+"
category = "video"
why = "HDR10+ adjusts the picture scene by scene on screens that support it."
arr_formats = ["radarr:HDR10+ Boost", "sonarr:HDR10+ Boost"]
when = { hdr = ["Hdr10Plus"] }

[[traits]]
id = "video.hdr-any"
label = "HDR of any kind"
category = "video"
why = "Any HDR format a television can show: HDR10, HDR10+, HLG, PQ, or Dolby Vision that falls back to HDR10."
arr_formats = ["sonarr:HDR"]

[traits.when]

[[traits.when.any]]
hdr = ["Hdr", "Hdr10", "Hdr10Plus", "Hlg", "Pq"]

[[traits.when.any]]
hdr = ["DolbyVision"]
not = { source = ["WebDl", "WebRip"], not = { service = ["HULU"] } }

[[traits.when.any]]
group = ["FraMeSToR", "HQMUX", "SiCFoI"]
resolution = ["2160p"]
not = { hdr = ["Hdr10Plus"] }

[[traits]]
id = "video.dv"
label = "Dolby Vision"
category = "video"
why = "Dolby Vision adjusts the picture scene by scene on screens that support it."
arr_formats = ["sonarr:DV Boost"]
when = { hdr = ["DolbyVision"] }

# ----------------------------------------------------------------------------------------------
# Audio
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "audio.dd-plus"
label = "Dolby Digital Plus"
category = "audio"
why = "Dolby Digital Plus is the usual streaming audio."
arr_formats = ["radarr:DD+", "sonarr:DD+"]
when = { audio_codec = ["Eac3"], atmos = false }

[[traits]]
id = "audio.dd-plus-atmos"
label = "Dolby Digital Plus with Atmos"
category = "audio"
why = "Dolby Digital Plus with Atmos adds height channels to the streaming audio."
arr_formats = ["radarr:DD+ ATMOS", "sonarr:DD+ ATMOS"]
when = { audio_codec = ["Eac3"], atmos = true }

[[traits]]
id = "audio.dd"
label = "Dolby Digital"
category = "audio"
why = "Dolby Digital is the older lossy disc and broadcast audio."
arr_formats = ["radarr:DD", "sonarr:DD"]
when = { audio_codec = ["Ac3"], atmos = false }

[[traits]]
id = "audio.truehd"
label = "TrueHD"
category = "audio"
why = "TrueHD is lossless disc audio."
arr_formats = ["radarr:TrueHD", "sonarr:TrueHD"]
when = { audio_codec = ["TrueHd"], atmos = false, not = { group = ["CtrlHD", "W4NK3R", "DON"] } }

[[traits]]
id = "audio.truehd-atmos"
label = "TrueHD with Atmos"
category = "audio"
why = "TrueHD with Atmos is lossless disc audio with height channels. CtrlHD, W4NK3R, DON and HQMUX ship it without always naming it."
arr_formats = ["radarr:TrueHD ATMOS", "sonarr:TrueHD ATMOS"]

[traits.when]
not = { audio_codec = ["Ac3", "Eac3", "Dts", "DtsHdMa", "DtsHdHra", "DtsX", "Flac"] }
any = [
    { audio_codec = ["TrueHd"], atmos = true },
    { audio_codec = ["TrueHd"], group = ["CtrlHD", "W4NK3R", "DON"] },
    { group = ["W4NK3R"] },
    { group = ["HQMUX"], atmos = true },
]

[[traits]]
id = "audio.dts"
label = "DTS"
category = "audio"
why = "DTS is the older lossy disc audio."
arr_formats = ["radarr:DTS", "sonarr:DTS"]
when = { audio_codec = ["Dts"] }

[[traits]]
id = "audio.dts-hd-ma"
label = "DTS-HD MA"
category = "audio"
why = "DTS-HD MA is lossless disc audio."
arr_formats = ["radarr:DTS-HD MA", "sonarr:DTS-HD MA"]
when = { audio_codec = ["DtsHdMa"] }

[[traits]]
id = "audio.dts-hd-hra"
label = "DTS-HD HRA"
category = "audio"
why = "DTS-HD HRA is high bitrate lossy disc audio."
arr_formats = ["radarr:DTS-HD HRA"]
when = { audio_codec = ["DtsHdHra"] }

[[traits]]
id = "audio.dts-x"
label = "DTS:X"
category = "audio"
why = "DTS:X is lossless disc audio with height channels."
arr_formats = ["radarr:DTS X", "sonarr:DTS X"]
when = { audio_codec = ["DtsX"] }

[[traits]]
id = "audio.opus"
label = "Opus"
category = "audio"
why = "Opus is the audio codec the fleet's own encodes use."
arr_formats = ["radarr:Opus", "sonarr:Opus"]
when = { audio_codec = ["Opus"] }

[[traits]]
id = "audio.surround-5-1"
label = "5.1 surround"
category = "audio"
why = "Surround audio beats stereo. The points stay well under the gaps between tiers."
arr_formats = ["radarr:5.1 Surround", "sonarr:5.1 Surround"]
when = { channels = ["5.1", "5.0"] }

[[traits]]
id = "audio.surround-6-1"
label = "6.1 surround"
category = "audio"
why = "Surround audio beats stereo. The points stay well under the gaps between tiers."
arr_formats = ["sonarr:6.1 Surround"]
when = { channels = ["6.1", "6.0"] }

[[traits]]
id = "audio.surround-7-1"
label = "7.1 surround"
category = "audio"
why = "Surround audio beats stereo. The points stay well under the gaps between tiers."
arr_formats = ["radarr:7.1 Surround", "sonarr:7.1 Surround"]
when = { channels = ["7.1", "7.0", "8.0", "8.1"] }

# ----------------------------------------------------------------------------------------------
# Guards
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "penalty.unwanted-groups"
label = "Unwanted groups"
category = "penalty"
why = "Groups the owner does not want in the library at any score."
arr_formats = ["radarr:Dont Want Release Group"]

[traits.when]
group = ["V3SP4EV3R", "Asiimov", "AOC", "Neonoir", "MrTentsaw", "Enjoy", "DE3PM", "HiDt"]

[[traits]]
id = "penalty.low-quality-groups"
label = "Low bitrate groups"
category = "penalty"
why = "YTS, YIFY, Pahe and similar groups trade too much picture for size."
arr_formats = ["radarr:Dont Want Release Group"]

[traits.when]
group = ["themoviesboss", "uHDT", "Pahe", "YTS", "YTS.MX", "YTS.AM", "YTS.LT", "YTS.AG", "YIFY"]

[[traits]]
id = "penalty.hindi"
label = "Hindi audio"
category = "penalty"
why = "A release that names Hindi audio is a dub or a dual-audio upload, not the original track alone."
arr_formats = ["radarr:Hindi"]
when = { language = ["Hindi"] }

[[traits]]
id = "penalty.not-original-language"
label = "Not in the original language"
category = "penalty"
why = "The release states its languages and the title's original language is not among them, so it is a dub."
arr_formats = ["radarr:Language: Not Original", "sonarr:Language: Not Original"]
when = { original_language = false }

[[traits]]
id = "penalty.executable"
label = "Executable file"
category = "penalty"
why = "A release whose name ends in a program extension is malware, not a film."
arr_formats = ["radarr:Executable Malware", "sonarr:Executable Malware"]
when = { name = '[. ](exe|msi|bat|cmd|scr|lnk|zipx|vbs|ps1|hta|pif)(\s*\[[^\]]*\])?\s*$' }

[[traits]]
id = "penalty.those-who-kill-us"
label = "Those Who Kill (US remake)"
category = "penalty"
why = "Releases of the 2014 US remake are filed under the 2019 Danish series by mistake."
when = { name = '\bThose[ ._-]?Who[ ._-]?Kill[ ._-]?US\b' }

[[traits]]
id = "penalty.odyssey-mockbusters"
label = "Known mockbuster uploads of The Odyssey"
category = "penalty"
why = "For the title tagged odyssey-mockbusters, these uploads are The Asylum's 2026 film, not Christopher Nolan's."

[traits.when]
title_tag = ["odyssey-mockbusters"]
any = [
    { group = ["Kitsune", "BONE", "LAMA"] },
    { name = 'NOT The Chris Nolan|\[WEBRip\] \[x265\] \[10bit\]' },
]

