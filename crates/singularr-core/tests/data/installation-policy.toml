"video.av1"                     = 10
"audio.surround-6-1"            = 10
"penalty.not-original-language" = -10000
"penalty.executable"            = -10000
"penalty.those-who-kill-us"     = -10000

# ----------------------------------------------------------------------------------------------
# Protections: what may replace the file the library has. A protection applies when the title
# carries one of its tags or when that file matches `current` (`held`, the older keyword, is still
# read). A candidate must then match `allow`. With no `allow`, nothing replaces the file.
# ----------------------------------------------------------------------------------------------

# Radarr release profile 5 (tag dirtyhippie, required term /^(?=.*dirtyhippie)(?=.*remux)/i).
# Files the encode pipeline renamed before 1 Nov 2026 carry the tag and not the group name.
# Radarr stores the group as 60fps-DirtyHippie, so both spellings are listed.
[[protections]]
id = "dirtyhippie"
label = "a DirtyHippie copy is replaced only by a DirtyHippie remux"
why = "The owner keeps the 60 fps version unless its own group releases a remux."
tags = ["dirtyhippie"]
current = { group = ["DirtyHippie", "60fps-DirtyHippie"] }
allow = { group = ["DirtyHippie", "60fps-DirtyHippie"], source = ["Remux"] }

# Radarr release profile 6 (tag open-matte, required term /\b(open[ ._-]?matte)\b/i).
# A DirtyHippie file that is also open matte keeps only the DirtyHippie rule, as in Radarr, where
# those titles carry the dirtyhippie tag alone: its remux need not be labeled open matte.
[[protections]]
id = "open-matte"
label = "an open matte copy is replaced only by another open matte copy"
why = "The owner keeps the taller frame, and a standard copy from a better tier must not replace it."
tags = ["open-matte"]
current = { edition = ["Open Matte"], not = { group = ["DirtyHippie", "60fps-DirtyHippie"] } }
allow = { edition = ["Open Matte"] }

# The hush-keep tag in Radarr and Sonarr. The arrs only stop their own encode rules for it and
# rely on the title being unmonitored. Here the tag itself holds the copy.
[[protections]]
id = "hush-keep"
label = "a title tagged hush-keep is left exactly as it is"
why = "The owner keeps this copy as it was imported, for example as the source of a lossless audio track."
tags = ["hush-keep"]

# The two release profiles with ignored terms are guards, not protections, because they must
# also stop a first grab: see penalty.odyssey-mockbusters (Radarr profile 4, tag
# odyssey-mockbusters) and penalty.those-who-kill-us (Sonarr profile 2, every series).
