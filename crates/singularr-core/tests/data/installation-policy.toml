# A real installation's rule set, copied for the tests (the installation itself reads its own file,
# named by SINGULARR_POLICY). The scores the tests assert are the ones that installation quotes for
# real releases, so a change to the rules that moves them is seen at once.
# This installation's policy: what it takes, what it prefers, and what it never replaces. It is
# instance configuration (DESIGN.md, Product and instance), named by SINGULARR_POLICY; the
# product's default is rules/policy.toml.
#
# Translated on 22 Nov 2026 from the arrs' live settings (fixtures/arr_config.json): every
# custom format became a trait, every quality profile a lane, every tag-scoped release profile a
# protection or a guard. From here on this file is the source of truth and is edited by hand.
#
# A trait is a named condition with a reason. A lane gives points to traits and sets the
# thresholds. A trait with no points in a lane still shows there, dimmed, when it matches.
# `arr_formats` names the custom format a trait came from, for the shadow comparison only.
#
# Conditions: every key must match. `any` needs one of its entries, `not` inverts. Picture and
# sound keys read the release name first and the file probe where the name is silent.

name = "home"
version = "2026-11-23"

# ----------------------------------------------------------------------------------------------
# The fleet's own encodes
# ----------------------------------------------------------------------------------------------

[[traits]]
id = "group.hush-shr"
label = "SHR, the fleet's master encode"
category = "group"
why = "SHR is the fleet's own master encode and the final copy of a title."
arr_formats = ["radarr:HUSH SHR", "sonarr:HUSH SHR"]
when = { group = ["SHR"] }

[[traits]]
id = "group.hush-shk"
label = "SHK, the fleet's size-first encode"
category = "group"
why = "SHK is the fleet's size-first encode for seasons that are deleted once watched, so nothing larger should replace it."
arr_formats = ["sonarr:HUSH SHK"]
when = { group = ["SHK"] }

[[traits]]
id = "group.hush-sht"
label = "SHT, a fleet conversion held above its source"
category = "group"
why = "SHT marks a fleet conversion that would score below the release it was made from, so that release is not grabbed again."
arr_formats = ["radarr:HUSH SHT", "sonarr:HUSH SHT"]
when = { group = ["SHT"] }

[[traits]]
id = "group.hush-shh"
label = "SHH, the fleet's HEVC conversion"
category = "group"
why = "SHH is the fleet's HEVC conversion of an H.264 release."
arr_formats = ["radarr:HUSH SHH", "sonarr:HUSH SHH"]
when = { group = ["SHH"] }

[[traits]]
id = "group.hush-sha"
label = "SHA, the fleet's AV1 conversion"
category = "group"
why = "SHA is the fleet's AV1 conversion of a release."
arr_formats = ["radarr:HUSH SHA", "sonarr:HUSH SHA"]
when = { group = ["SHA"] }

